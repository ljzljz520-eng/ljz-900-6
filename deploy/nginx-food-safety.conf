# nginx 反向代理示例（HTTPS 必配：手机网页端摄像头/扫码要求安全上下文）
# 放到 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name safety.example.edu.cn;
    # 全部跳转 https（摄像头 getUserMedia 必须 https，localhost 除外）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name safety.example.edu.cn;

    ssl_certificate     /etc/nginx/certs/safety.crt;   # 替换为学校 CA 签发证书
    ssl_certificate_key /etc/nginx/certs/safety.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 请求体上限略大于单张上限（默认单张 8MB，这里留余量）
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
